tools:
- name: digg_get_feed
  description: 'Read published posts exactly as a Digg website Feed lists them: topic is all for the Home
    Feed across every public Topic (the default) or a public Topic slug (ai, science, sports and so on),
    with view Top, Newest, Best, Hot or Trending and, for Top, a range. The first limit posts are the
    first limit the website shows for the same selection, in the same order: Science, Trending, 5 is topic
    science, view trending, limit 5. With no view, all and every Topic read Trending, as on the website;
    a range without a view reads Top. An explicit selection never falls back to another sort. Trending
    selects up to 100 recent posts and preserves their order for the traversal; refresh after its one-hour
    cursor expires. Today resets at Pacific midnight. Continue with nextCursor and an unchanged selection;
    stop when it is null. Rankings move, and the website''s first page can be up to ten minutes old; deduplicate
    by ID. unavailableCount counts posts in this slice that could not be returned.'
- name: digg_get_top_posts_of_the_day
  description: 'Read the top 5 posts of one Feed day, ranked by Digg Score, as Digg shows them: topic
    is all for every public Topic (the default) or a public Topic slug. A Feed day is a calendar date
    in America/Los_Angeles. The list shows today from 8:00 am Pacific once today has at least 5 posts;
    until then it shows yesterday, ranked by the Digg Score each post closed its day with. day and isToday
    say which day it is. Today''s scores and order change; yesterday''s are settled. Use returned UUIDs
    with digg_get_post.'
- name: digg_search_posts
  description: Search recent post titles and TLDRs in every public Topic using Digg semantic and keyword
    search, as the website does. Searches live posts from the last 90 days and returns only currently
    published posts, each with its Topic. Returns at most limit matches from the best 80 candidates across
    Topics; this is not a full historical archive search. Use returned UUIDs with digg_get_post.
- name: digg_get_post
  description: Get a published post's copy, as its Digg post page shows it, and a page of attributed X
    or webpage sources by UUID, in any public Topic. Live and archived posts are readable; a post merged
    into another returns the surviving post, so the returned id and url may differ from the requested
    id. Continue sources with nextSourceOffset. Source text is an excerpt, not proof of every claim; cite
    the original URL. Missing and unavailable posts return the same error.
- name: digg_get_profile
  description: 'Read a person''s or publisher''s public Digg profile by Digg username, as its page at
    https://digg.com/u/<username> shows it: name, avatar, banner, bio, Connections (X, GitHub, website),
    the public Topics in which it is a Topic Influencer, the counts Digg can report so far, and which
    activity lists it has. The id is stable; a username can change, and an old username is not kept. A
    profile whose account is banned or has not finished signup returns status unavailable with no profile;
    an unknown username is an error.'
- name: digg_get_profile_diggs
  description: List the published posts a Digg profile has Dugg, newest Digg first, as the Diggs tab on
    https://digg.com/u/<username> shows them, with the total across every page. Page with nextCursor.
    Withdrawn Diggs and posts readers cannot see are left out. A profile whose account is banned or has
    not finished signup answers status unavailable. Only profiles whose tabs in digg_get_profile include
    diggs have this list; others, and unknown profiles, return an error.
- name: digg_get_profile_featured_in
  description: 'Page the published posts that include, among their sources, an X post this profile wrote,
    as the Featured in tab of https://digg.com/u/<username> lists them: newest first, with the total.
    Quote posts and replies it wrote count; its reposts of someone else''s post, webpage sources and website
    Connections never do. Only public Topics are included. Pass nextCursor back as cursor for the next
    page. A profile whose account is banned or has not finished signup returns status unavailable with
    no posts; an unknown username is an error.'
- name: digg_get_profile_followers
  description: Page through the people who follow a Digg profile, by Digg username, newest follow first,
    with the total. Each person links to their own Digg profile. Pass nextCursor back as cursor for the
    next page. A profile whose account is banned or has not finished signup returns status unavailable
    with an empty list; an unknown username is an error.
- name: digg_get_profile_following
  description: Page through the Digg profiles a profile follows, by Digg username, newest follow first,
    with the total. Each entry links to that Digg profile. Pass nextCursor back as cursor for the next
    page. A profile whose account is banned or has not finished signup returns status unavailable with
    an empty list; an unknown username is an error.
