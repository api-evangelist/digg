name: Digg
description: Digg is a technology news aggregation and community curation platform, relaunched
  under new ownership and backed by Andreessen Horowitz (a16z) and True Ventures. It surfaces
  trending stories, discussions, and video signals drawn largely from X/Twitter, ranking them
  by community engagement and editorial signals. The platform tracks contributor rankings,
  rising stories, today's highlights, and GitHub repository activity, positioning itself as an
  AI-assisted discovery hub for technology, startups, and AI news. As surfaced here, Digg is a
  consumer web product with no public developer API, SDKs, or documentation; this profile
  captures its identity and web/domain-security posture for the API Evangelist network.
